[package]
name = "usbguard-authorizer"
version = "0.0.1"
edition = "2026"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
anyhow = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.5.0"
libc = "0.2.186"
 